<title id="title">Oscar Ricaurte | WENDOSKI07</title><desc id="desc">Terminal animada de Oscar Ricaurte. Desarrollo, proyectos y código. Una señal recorre un diagrama de nodos y el cursor parpadea.</desc>
<defs>
<radialGradient id="glow"><stop stop-color="#126d88" stop-opacity=".28"/><stop offset="1" stop-color="#0b111b" stop-opacity="0"/></radialGradient>
<linearGradient id="edge"><stop stop-color="#46d9d0"/><stop offset=".55" stop-color="#4264a9"/><stop offset="1" stop-color="#a786f7"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bb8d0" stroke-opacity=".055"/></pattern>
