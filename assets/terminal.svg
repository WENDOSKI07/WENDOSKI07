<style>
text{font-family:Consolas,'Liberation Mono',monospace}.muted{fill:#879bb2}.accent{fill:#5ce0d3}
.cursor{animation:blink 1.1s steps(1,end) infinite}.typing{animation:write 10s steps(34,end) infinite}.signal{animation:flow 5s linear infinite}.halo{animation:pulse 3s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes write{0%,8%{width:0}40%,90%{width:570px}100%{width:0}}@keyframes flow{to{stroke-dashoffset:-240}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.cursor,.typing,.signal,.halo{animation:none}}
</style>
</defs>
